name: Build and Push Docker Images

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 0"
  push:
    branches:
      - main
    paths:
      - "porkbun-dns/**"

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}


      - name: Build Docker Images
        run: nix run .#build-docker-all
        working-directory: ./porkbun-dns

      - name: Log in to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Docker Images
        run: |
          docker push jjsuperpower/porkbun-ddns:latest
          docker push jjsuperpower/porkbun-ddns:debian
          docker push jjsuperpower/porkbun-ddns:alpine
          docker push jjsuperpower/porkbun-ddns:nix
